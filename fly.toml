app = "torbot-il"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  TZ = "Asia/Jerusalem"

# Schema push + seed run in a temporary VM BEFORE the new release goes live,
# so the app's start command only has to bind the port. This avoids the race
# where Fly's health checks hit :3000 before push/seed finish (which crashed
# deploys #35/#36 when the Neon compute was cold).
[deploy]
  release_command = "sh -c 'npx drizzle-kit push && npx tsx src/db/seed.ts'"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "get"
    timeout = "5s"
    path = "/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
