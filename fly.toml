# fly.toml app configuration file generated for torbot on 2026-10-13T09:21:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'torbot'
primary_region = 'ams'

[build]

[deploy]
  release_command = "sh -c 'npx drizzle-kit push && npx tsx src/db/seed.ts'"

[env]
  PORT = '3000'
  TZ = 'Asia/Jerusalem'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
